    ${conta?`<label class="chk" id="fReajW" hidden><input type="checkbox" id="fReaj"> <span>Foi reajuste: usar esse valor nos próximos meses</span></label>`:''}
    ${extras?`<div class="field"><label>Como foi o pagamento?</label><div class="chips" id="fModo">
      <button class="chip on" data-m="certo">✓ Valor certo</button><button class="chip" data-m="juros">+ Teve juros ou multa</button><button class="chip" data-m="desc">− Teve desconto</button></div></div>
    <div class="field" id="wJuros" hidden><label for="fJuros">Juros e multa pagos</label><input id="fJuros" inputmode="decimal" placeholder="0,00"><div id="fJurosInfo" class="small muted" style="margin-top:3px"></div></div>
    <div class="field" id="wDesc" hidden><label for="fDesc">Desconto conseguido</label><input id="fDesc" inputmode="decimal" placeholder="0,00"></div>
    <div class="total"><span class="small muted">Total que saiu da conta</span><b id="fTotal"></b></div>`:''}
    ${campoData()}
    <div class="field"><label for="fNota">Comentário (opcional)</label><input id="fNota" placeholder="Ex.: pago pelo app do banco" autocomplete="off"></div>
    ${extras?blocoFoto('comprovante'):''}
    <div class="small muted">Registrado por <b>${esc(quem)}</b>. Troque em ⚙️ Ajustes.</div>
    <div class="stack"><button class="btn wide ${cor}" id="fOk">${esc(botao)}</button><button class="btn sec wide" id="fX">Cancelar</button></div>`);
  let mJ=false,mD=false,jManual=false,jAuto=false;
  const ler=()=>{const v=parseBRL($('fValor').value)||0,j=extras&&mJ?parseBRL($('fJuros').value)||0:0,d=extras&&mD?parseBRL($('fDesc').value)||0:0;return{v,j,d}};
  const atualiza=()=>{
    if(conta){const v=parseBRL($('fValor').value);$('fReajW').hidden=!(v>0&&Math.abs(v-valor)>0.009)}
    if(!extras)return;const{v,j,d}=ler();$('fTotal').textContent=brl(v+j-d);
  };
  const pintar=()=>{
    if(!extras)return;
    document.querySelectorAll('#fModo .chip').forEach(b=>b.classList.toggle('on',b.dataset.m==='certo'?!mJ&&!mD:b.dataset.m==='juros'?mJ:mD));
    $('wJuros').hidden=!mJ;$('wDesc').hidden=!mD;atualiza();
  };
  const auto=()=>{
    if(!extras||!conta||jManual)return;
    const e=encargos(conta,mesRef,$('fData').value,parseBRL($('fValor').value)||0);
    if(e.valor>0){mJ=true;jAuto=true;$('fJuros').value=fmtNum(e.valor);
      $('fJurosInfo').textContent=`Calculado: ${String(Number(conta.multa)||0).replace('.',',')}% de multa + ${String(Number(conta.juros)||0).replace('.',',')}% ao mês, ${e.dias} dia${e.dias>1?'s':''} de atraso. Confira no boleto.`}
    else if(jAuto){mJ=false;jAuto=false;$('fJuros').value='';$('fJurosInfo').textContent=''}
    pintar();
  };
  if(extras){
    $('fModo').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;e.stopPropagation();const m=b.dataset.m;
      if(m==='certo'){mJ=false;mD=false}else if(m==='juros')mJ=!mJ;else mD=!mD;pintar()};
    $('fJuros').oninput=()=>{jManual=true;$('fJurosInfo').textContent='';atualiza()};
    $('fDesc').oninput=atualiza;
    $('fData').onchange=auto;
  }
  $('fValor').oninput=()=>{auto();atualiza()};
  auto();atualiza();
  if(extras)ligarFoto('comprovante',r=>{
    const vd=num(r.valor_documento),j=num(r.juros_multa),d=num(r.desconto),t=num(r.total_pago);
    if(vd>0)setMoney('fValor',vd);else if(t>0)setMoney('fValor',t-(j>0?j:0)+(d>0?d:0));
    if(j>0){setMoney('fJuros',j);mJ=true;jManual=true;$('fJurosInfo').textContent='Lido do comprovante.'}
    if(d>0){setMoney('fDesc',d);mD=true}
    if(r.data_pagamento&&/^\d{4}-\d{2}-\d{2}$/.test(r.data_pagamento))$('fData').value=r.data_pagamento;
    pintar();
  });
  $('fX').onclick=fechar;
  $('fOk').onclick=async()=>{
    const{v,j,d}=ler();
    if(!(v>0)){toast('Digite um valor maior que zero');return}
    if(j<0||d<0){toast('Juros e desconto não podem ser negativos');return}
    if(d>v+j){toast('O desconto não pode ser maior que a conta');return}
    $('fOk').disabled=true;
    try{
      const fotoId=foto?await foto.promise:null;
      const dados={valor:v,data:$('fData').value||hojeISO(),nota:$('fNota').value.trim()||null};
      if(extras){dados.juros=j||0;dados.desconto=d||0;if(fotoId)dados.foto=fotoId}
      await onOk(dados,{reajuste:!!(conta&&!$('fReajW').hidden&&$('fReaj').checked)});fechar();
    }catch(e){$('fOk').disabled=false}
  };
}
function avisoPag(base,dd){
  if(dd.juros>0)return base+` Mas ${brl(dd.juros)} foram de juros 😬`;
  if(dd.desconto>0)return base+` E ainda economizou ${brl(dd.desconto)}! 🤝`;
  return base;
}
/* Reajuste: novo valor vale deste mês em diante; meses anteriores guardam o valor antigo */
async function aplicarReajuste(c,m,novo){
  const exc={...(c.excecoes||{})};
  let x=c.inicio||S.config.inicio||m,n=0;
  while(x<m&&n<240){if(ativa(c,x)&&exc[x]==null)exc[x]=valorConta(c,x);x=addMes(x,1);n++}
  for(const k of Object.keys(exc))if(k>=m)delete exc[k];
  await upd('contas',c.id,{...c,valor:novo,excecoes:exc});
}
function pagarObrigacao(tipo,id){
  const o=obrigacoes(mes).find(x=>x.tipo===tipo&&x.id===id);if(!o)return;
  const resta=Math.max(0,o.valor-o.pago);
  abrirPagamento({titulo:o.nome.replace('⚔️ ',''),sub:`${nomeMes(mes)}, previsto ${brl(o.valor)}`,valor:resta,
    conta:tipo==='conta'?o.ref:null,mesRef:mes,
    onOk:async(dd,op)=>{
      if(op&&op.reajuste&&tipo==='conta')await aplicarReajuste(o.ref,mes,dd.valor+o.pago);
      const p={tipo,mes,quem,...dd};
      if(tipo==='conta')p.contaId=id;else p.dividaId=id;
      await add('pagamentos',p);
      toast(avisoPag(tipo==='divida'?'⚔️ Golpe! +25 XP.':op&&op.reajuste?'✓ Pago e valor reajustado. +10 XP.':'✓ Pago! +10 XP.',dd));
    }});
}

function linhaPag(p){
  return `<div class="hist" style="padding:10px 0;flex-wrap:wrap;gap:4px"><span>${dataBR(p.data)} ${p.quem?'por '+esc(p.quem):''}
    ${Number(p.juros)>0?`<br><span class="neg small">+${brl(p.juros)} juros e multa</span>`:''}${Number(p.desconto)>0?`<br><span class="pos small">−${brl(p.desconto)} desconto</span>`:''}
    ${p.nota?`<br><span class="nota">💬 ${esc(p.nota)}</span>`:''}</span>
    <span><b>${brl(totalPago(p))}</b> <button class="btn sec small" style="padding:4px 10px" data-act="desfazer" data-id="${p.id}">Desfazer</button></span>
    ${p.foto?`<img class="thumb" src="/_blob/${esc(p.foto)}" alt="Comprovante">`:''}</div>`;
}
function verPagamentos(tipo,id){
  const o=obrigacoes(mes).find(x=>x.tipo===tipo&&x.id===id);if(!o)return;
  abrir(`<h3>${esc(o.nome.replace('⚔️ ',''))}</h3><div class="muted small">Pagamentos em ${esc(nomeMes(mes))}</div>
    ${o.pagos.map(linhaPag).join('')}
    <div class="stack"><button class="btn sec wide" id="fX">Fechar</button></div>`);
  $('fX').onclick=fechar;
}
async function desfazer(pid){
  const p=S.pagamentos.find(x=>x.id===pid);if(!p)return;
  if(!await perguntar('Desfazer pagamento?',`O pagamento de ${brl(totalPago(p))} vai sair do histórico e a conta volta a ficar em aberto.`,'Desfazer'))return;
  await del('pagamentos',pid);toast('Pagamento desfeito');
}

/* ---- Compra parcelada ---- */
function formParcelado(cartaoEscolhido){
  const cs=listaDeCartoes();
  let cartaoId=cartaoEscolhido||'';
  abrir(`<h3>Compra parcelada</h3><div class="muted small">Ela entra sozinha em cada mês até acabar.</div>
    <div class="field"><label for="pNome">O que foi comprado?</label><input id="pNome" placeholder="Ex.: Geladeira" autocomplete="off"></div>
    <div class="field"><label>Como foi pago?</label>
      <div class="chips" id="pComo">
        <button type="button" class="chip ${cartaoId?'':'on'}" data-cartao="">Boleto / carnê / débito</button>
        ${cs.map(x=>`<button type="button" class="chip ${cartaoId===x.id?'on':''}" data-cartao="${x.id}">💳 ${esc(x.nome)}</button>`).join('')}
      </div>
      <div class="small muted" id="pComoDica" style="margin-top:3px">${cs.length
        ? 'No cartão, a parcela não vira conta à parte: ela passa a compor a fatura daquele cartão.'
        : 'Nenhum cartão cadastrado ainda. Marque a conta da fatura (ex.: "Nubank") como cartão pelo ⋯ dela.'}</div>
    </div>
    <div class="two"><div class="field"><label for="pTotal">Valor total</label><input id="pTotal" inputmode="decimal" placeholder="0,00"></div>
    <div class="field"><label for="pN">Nº de parcelas</label><input id="pN" inputmode="numeric" placeholder="Ex.: 10"></div></div>
    <div class="total"><span class="small muted">Cada parcela</span><b id="pParc">R$ 0,00</b></div>
    <div class="two"><div class="field"><label for="pIni">Primeira parcela em</label><input id="pIni" type="month" value="${mes}"></div>
    <div class="field"><label for="pDia">Dia do vencimento</label><input id="pDia" inputmode="numeric" placeholder="Ex.: 10"></div></div>
    <div class="field"><label for="pTit">De quem</label><select id="pTit"><option>Casal</option><option ${quem==='Gabriel'?'selected':''}>Gabriel</option><option ${quem==='Luana'?'selected':''}>Luana</option></select></div>
    <div class="field"><label for="pNota">Comentário (opcional)</label><input id="pNota" placeholder="Ex.: cartão Nubank da Luana" autocomplete="off"></div>
    <div class="stack"><button class="btn wide" id="fOk">Salvar parcelamento</button><button class="btn sec wide" id="fX">Cancelar</button></div>`);
  const calc=()=>{const t=parseBRL($('pTotal').value),n=parseInt($('pN').value,10);$('pParc').textContent=t>0&&n>0?`${n}× ${brl(t/n)}${$('pIni').value?', até '+curtoMes(addMes($('pIni').value,n-1)):''}`:'R$ 0,00'};
  ['pTotal','pN','pIni'].forEach(i=>$(i).oninput=calc);
  // No cartão, quem manda no vencimento é a fatura — pedir um dia aqui só criaria duas datas
  // para a mesma coisa.
  const pintarComo=()=>{
    document.querySelectorAll('#pComo .chip').forEach(b=>b.classList.toggle('on',(b.dataset.cartao||'')===cartaoId));
    const noCartao=!!cartaoId;
    $('pDia').closest('.field').hidden=noCartao;
    if(noCartao){
      const cartao=cartaoPorId(cartaoId);
      $('pComoDica').textContent=`Vai compor a fatura de ${cartao?cartao.nome:'—'}. O vencimento é o da fatura.`;
    }else if(cs.length){
      $('pComoDica').textContent='No cartão, a parcela não vira conta à parte: ela passa a compor a fatura daquele cartão.';
    }
  };
  $('pComo').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;e.stopPropagation();cartaoId=b.dataset.cartao||'';pintarComo()};
  pintarComo();
  $('fX').onclick=fechar;
  $('fOk').onclick=async()=>{
    const nome=$('pNome').value.trim(),t=parseBRL($('pTotal').value),n=parseInt($('pN').value,10),ini=$('pIni').value,dia=parseInt($('pDia').value,10);
    if(!nome){toast('Diga o que foi comprado');return}
    if(!(t>0)){toast('Digite o valor total');return}
    if(!(n>=1&&n<=120)){toast('Número de parcelas de 1 a 120');return}
    if(!ini){toast('Escolha o mês da primeira parcela');return}
    if(!cartaoId&&$('pDia').value&&!(dia>=1&&dia<=31)){toast('O dia precisa ser de 1 a 31');return}
    $('fOk').disabled=true;
    const parcela=Math.round(t/n*100)/100, fim=addMes(ini,n-1);
    try{
      const nova={nome,valor:parcela,total:t,parcelas:n,parcelaInicial:1,inicio:ini,fim,
        dia:cartaoId?null:(dia||null),categoria:'Parcela',titular:$('pTit').value,nota:$('pNota').value.trim()||null};
      if(cartaoId)nova.cartaoId=cartaoId;
      await add('contas',nova);
      fechar();
      if(cartaoId)await perguntarSobreFatura(cartaoId,parcela,ini,fim,nome,n);
      else toast(`Parcelamento salvo: ${n}× ${brl(parcela)}`);
    }catch(e){$('fOk').disabled=false}
  };
}

/* Depois de ligar uma compra a um cartão: a fatura daqueles meses já contava com ela, ou
   precisa crescer? Pergunto em vez de decidir — somar sozinho numa fatura que já incluía a
   compra cobraria o mesmo dinheiro duas vezes, e é exatamente o tipo de erro que ninguém
   percebe depois. */
async function perguntarSobreFatura(cartaoId,parcela,ini,fim,nome,n){
  const cartao=cartaoPorId(cartaoId);
  if(!cartao){toast('Parcelamento salvo');return}
  const meses=[];let m=ini;while(m<=fim&&meses.length<120){meses.push(m);m=addMes(m,1)}
  const comValor=meses.filter(x=>ativa(cartao,x)).map(x=>({mes:x,valor:valorConta(cartao,x)}));
  abrir(`<h3>Atualizar a fatura?</h3>
    <div class="muted small">${esc(nome)} — ${n}× de ${brl(parcela)} na fatura de <b>${esc(cartao.nome)}</b>.</div>
    <div class="small muted" style="margin-top:10px">A fatura de ${esc(nomeMes(ini).split(' ')[0])} está cadastrada como <b>${brl(valorConta(cartao,ini))}</b>. Esse valor <b>já inclui</b> esta compra?</div>
    <div class="stack">
      <button class="btn wide" id="fjSomar">Não, somar ${brl(parcela)} em cada mês<br><span class="small muted">A fatura de ${esc(curtoMes(ini))} a ${esc(curtoMes(fim))} sobe ${brl(parcela)}.</span></button>
      <button class="btn sec wide" id="fjNada">Já inclui, não mexer<br><span class="small muted">A parcela só passa a aparecer dentro da fatura, sem mudar o total.</span></button>
    </div>`);
  $('fjNada').onclick=()=>{fechar();toast('Parcelamento salvo dentro da fatura')};
  $('fjSomar').onclick=async()=>{
    const atual=S.contas.find(x=>x.id===cartaoId);if(!atual){fechar();return}
    const exc={...(atual.excecoes||{})};
    for(const {mes:x,valor} of comValor)exc[x]=Math.round((valor+parcela)*100)/100;
    await upd('contas',cartaoId,{...atual,excecoes:exc});
    fechar();toast(`Fatura de ${cartao.nome} atualizada em ${comValor.length} ${comValor.length===1?'mês':'meses'}`);
  };
}

/* Formulário genérico para contas, dívidas e metas */
function formulario({titulo,campos,valores={},onSalvar,onApagar}){
  const input=f=>{
    const v=valores[f.k]??'';
    if(f.tipo==='select')return `<select id="c_${f.k}">${f.opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    if(f.tipo==='money')return `<input id="c_${f.k}" inputmode="decimal" value="${v===''?'':fmtNum(Number(v))}" placeholder="${esc(f.ph||'')}">`;
    if(f.tipo==='month')return `<input id="c_${f.k}" type="month" value="${esc(v)}">`;
    if(f.tipo==='pct')return `<input id="c_${f.k}" inputmode="decimal" value="${v===''||v==null?'':String(v).replace('.',',')}" placeholder="${esc(f.ph||'')}">`;
    if(f.tipo==='number')return `<input id="c_${f.k}" inputmode="numeric" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
    return `<input id="c_${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
  };
  abrir(`<h3>${esc(titulo)}</h3>${campos.map(f=>f.grupo?`<h3 class="sec" style="margin-left:0">${esc(f.grupo)}</h3>`:`<div class="field"><label for="c_${f.k}">${esc(f.label)}</label>${input(f)}${f.dica?`<div class="small muted" style="margin-top:3px">${esc(f.dica)}</div>`:''}</div>`).join('')}
    <div class="stack"><button class="btn wide" id="fOk">Salvar</button>${onApagar?'<button class="btn sec wide" id="fDel" style="color:var(--red)">Apagar</button>':''}<button class="btn sec wide" id="fX">Cancelar</button></div>`);
  $('fX').onclick=fechar;
  if(onApagar)$('fDel').onclick=onApagar;
  $('fOk').onclick=async()=>{
    const out={};
    for(const f of campos){
      if(f.grupo)continue;
      const raw=$('c_'+f.k).value.trim();
      if(f.tipo==='money'||f.tipo==='pct'){const n=parseBRL(raw);out[f.k]=isNaN(n)?null:n}
      else if(f.tipo==='number'){const n=parseInt(raw,10);out[f.k]=isNaN(n)?null:n}
      else out[f.k]=raw||null;
      if(f.obrig&&(out[f.k]===null||out[f.k]==='')){toast('Preencha: '+f.label);return}
    }
    if(out.dia!=null&&(out.dia<1||out.dia>31)){toast('O dia precisa ser de 1 a 31');return}
    $('fOk').disabled=true;
    try{await onSalvar(out);fechar();toast('Salvo')}catch(e){$('fOk').disabled=false}
  };
}

function editar(col,campos,titulo,id,extraNovo={}){
  const atual=id?S[col].find(x=>x.id===id):null;
  formulario({titulo:(atual?'Editar ':'Nova ')+titulo,campos,valores:atual||extraNovo,
    onSalvar:async v=>{
      if(col==='contas'){
        if(v.parcelas!=null){
          if(!(v.parcelas>=1&&v.parcelas<=600)){toast('Total de parcelas inválido');throw new Error('x')}
          const pi=v.parcelaInicial||1;
          if(pi<1||pi>v.parcelas){toast('A parcela do mês de início precisa ser entre 1 e '+v.parcelas);throw new Error('x')}
          if(!v.inicio){toast('Preencha em que mês começa');throw new Error('x')}
          v.parcelaInicial=pi;v.fim=addMes(v.inicio,v.parcelas-pi);
        }
        if(v.fim&&v.inicio&&v.fim<v.inicio){toast('O fim não pode ser antes do começo');throw new Error('x')}
        if((v.multa!=null&&(v.multa<0||v.multa>100))||(v.juros!=null&&(v.juros<0||v.juros>100))){toast('Multa e juros entre 0 e 100%');throw new Error('x')}
      }
      atual?await upd(col,id,{...atual,...v}):await add(col,{...extraNovo,...v})},
    onApagar:atual?async()=>{
      const temPag=S.pagamentos.some(p=>p.contaId===id||p.dividaId===id||p.metaId===id);
      if(await perguntar('Apagar '+titulo.toLowerCase()+'?',temPag?'Os pagamentos já registrados continuam no histórico e no XP.':'Essa ação não pode ser desfeita.','Apagar')){await del(col,id);toast('Apagado')}
    }:null});
}

/* ---- Compartilhar a casa: link de uso único ---- */
async function convidar(){
  let j;
  try{j=await chamar('/api/convites',{method:'POST'})}catch(e){toast('Não deu pra criar o convite');return}
  const url=location.origin+location.pathname+'?convite='+j.token;
  const venc=new Date(j.expira_em).toLocaleDateString('pt-BR');
  abrir(`<h3>Convite para ${esc(CASA?CASA.nome:'esta casa')}</h3>
    <div class="muted small">Quem abrir este link e entrar passa a ver e lançar as mesmas contas que você. Vale uma vez só, até ${esc(venc)}.</div>
    <div class="field"><label for="cvLink">Link</label><input id="cvLink" value="${esc(url)}" readonly onclick="this.select()"></div>
    <div class="stack">
      <button class="btn wide" id="cvCopiar">Copiar link</button>
      ${navigator.share?'<button class="btn sec wide" id="cvEnviar">Enviar pelo WhatsApp, e-mail…</button>':''}
      <button class="btn sec wide" id="fX">Fechar</button>
    </div>`);
  $('fX').onclick=fechar;
  $('cvCopiar').onclick=async()=>{
    try{await navigator.clipboard.writeText(url);toast('Link copiado')}
    catch(e){$('cvLink').select();toast('Selecione e copie o link')}
  };
  if($('cvEnviar'))$('cvEnviar').onclick=()=>navigator.share({title:'Missão Finanças',text:'Vamos controlar as contas juntos:',url}).catch(()=>{});
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='pagar')pagarObrigacao(b.dataset.tipo,id);
  else if(a==='verPag')verPagamentos(b.dataset.tipo,id);
  else if(a==='desfazer')desfazer(id);
  else if(a==='golpe'){
    const d=S.dividas.find(x=>x.id===id);if(!d)return;const sal=saldoDivida(d);
    abrirPagamento({titulo:'⚔️ '+d.nome,sub:`Vida restante ${brl(sal)}. O pagamento conta em ${nomeMes(mes)}.`,valor:Number(d.parcela)>0?Math.min(d.parcela,sal):sal,cor:'red',botao:'Atacar',
      onOk:async dd=>{await add('pagamentos',{tipo:'divida',dividaId:id,mes,quem,...dd});const morto=dd.valor>=sal-0.009;toast(morto?'🏆 Chefão derrotado! +250 XP':avisoPag('⚔️ Golpe! +25 XP.',dd),morto)}});
  }
  else if(a==='editDiv')editar('dividas',CAMPOS_DIVIDA,'dívida',id);
  else if(a==='novaDiv')editar('dividas',CAMPOS_DIVIDA,'dívida',null,{titular:'Gabriel',ordem:S.dividas.length+1});
  else if(a==='aporte'||a==='retirada'){
    const g=S.metas.find(x=>x.id===id);if(!g)return;const ret=a==='retirada';
    abrirPagamento({titulo:(ret?'Retirar de ':'Guardar em ')+g.nome,sub:`Hoje: ${brl(atualMeta(g))}. Conta em ${nomeMes(mes)}.`,valor:ret?0:(Number(g.aporteMensal)||0),cor:ret?'red':'gold',botao:ret?'Retirar':'Guardar',extras:false,
      onOk:async dd=>{
        const v=dd.valor;
        if(ret&&v>atualMeta(g)+0.009){toast('Não dá para retirar mais do que está guardado');throw new Error('x')}
        await add('pagamentos',{tipo:'meta',metaId:id,mes,data:dd.data,nota:dd.nota,valor:ret?-v:v,quem});
        toast(ret?'Retirada registrada':'🌱 Guardado! +'+Math.floor(v/20)+' XP');
      }});
  }
  else if(a==='editMeta')editar('metas',CAMPOS_META,'meta',id);
  else if(a==='novaMeta')editar('metas',CAMPOS_META,'meta',null,{icone:'🎯',ordem:S.metas.length+1});
  else if(a==='lancar')lancar();
  else if(a==='novoGasto')formGasto(null);
  else if(a==='editGasto')formGasto(id,b.dataset.col||'gastos');
  else if(a==='novoParcelado')formParcelado();
  else if(a==='novaReceita')formReceita(null);
  else if(a==='editReceita')formReceita(id);
  else if(a==='salvarRenda'){const v=parseBRL($('aRenda').value);if(!(v>=0)){toast('Valor inválido');return}await saveConfig({...S.config,rendaFixa:v});toast('Renda salva')}
  else if(a==='sair')sair();
  else if(a==='opcoesConta')opcoesConta(id);
  else if(a==='verFatura')verFatura(id);
  else if(a==='novoParceladoNoCartao')formParcelado(id);
  else if(a==='marcarCartao')marcarComoCartao(id);
  else if(a==='ligarNoCartao')escolherCartao(id);
  else if(a==='despular'){
    const c=S.contas.find(x=>x.id===id);if(!c)return;
    await upd('contas',id,{...c,pulos:(c.pulos||[]).filter(m=>m!==mes)});toast('De volta em '+nomeMes(mes));
  }
  else if(a==='convidar')convidar();
  else if(a==='renomearCasa')renomearCasa();
  else if(a==='salvarTeto'){const v=parseBRL($('aTeto').value);if(!(v>=0)){toast('Valor inválido');return}await saveConfig({...S.config,tetoLazer:v});toast('Teto salvo')}
  else if(a==='editConta')editar('contas',CAMPOS_CONTA,'conta',id);
  else if(a==='novaConta')editar('contas',CAMPOS_CONTA,'conta',null,{inicio:mes,categoria:'Essencial',titular:'Casal'});
});
